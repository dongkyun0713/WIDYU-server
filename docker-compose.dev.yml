# Development environment override
# 사용법: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# 개발 환경은 내부 MySQL 컨테이너 사용

services:
  # MySQL Database (개발 전용)
  mysql:
    image: mysql:8.0
    container_name: widyu-mysql-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${MYSQL_USERNAME}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    networks:
      - widyu-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Spring API (로컬/개발 설정 오버라이드)
  widyu-api:
    container_name: widyu-api-dev
    environment:
      SPRING_PROFILES_ACTIVE: dev
      # JVM Options (개발 환경) - Dockerfile ENV JAVA_OPTS 기본값을 완전히 대체
      JAVA_OPTS: >
        -XX:+UseContainerSupport
        -Xms256m
        -Xmx512m
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=200
        -Dfile.encoding=UTF-8
        -Duser.timezone=Asia/Seoul
        -Djava.security.egd=file:/dev/./urandom
    depends_on:
      - mysql
      - redis
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis (로컬/개발 설정)
  redis:
    container_name: widyu-redis-dev
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx (로컬/개발 설정)
  nginx:
    container_name: widyu-nginx-dev
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql_data:
    driver: local
