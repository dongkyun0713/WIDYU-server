spring:
  application:
    name: WIDYU-backend
  profiles:
    group:
      local: "local, datasource, fcm, pay, s3"
      dev: "dev, datasource, fcm, pay, s3"
      prod: "prod, datasource, fcm, pay, s3"
      test: "test, fcm, pay, s3"

    include:
      - auth
      - security
      - coolsms
      - redis
      - imp
      - oauth
      - video
      - pay
      - medicine
      - actuator
      - ai
      - juso
      - sensor

admin:
  email: ${ADMIN_EMAIL}
  password: ${ADMIN_PASSWORD}

# 보호자의 위치 열람 통보 운영값(LLD-0056 4절, ADR-0036 결정 4)
location-access:
  # 같은 보호자의 반복 조회를 한 건으로 합치는 시간(분). 법무 검토가 「건마다」를 요구하면 0으로 둔다.
  immediate-cooldown-min: ${LOCATION_ACCESS_IMMEDIATE_COOLDOWN_MIN:10}
  # 「모아서」 통보와 쿨다운으로 합쳐진 건을 묶어 내보내는 시각. 기본 매일 09:00.
  digest-cron: ${LOCATION_ACCESS_DIGEST_CRON:0 0 9 * * *}

swagger:
  version: ${SWAGGER_VERSION:0.0.1}
  url: ${SWAGGER_URL:http://localhost:8080}

springdoc:
  swagger-ui:
    urls-primary-name: 전체 API

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level traceId=%X{traceId:-none} [%thread] %logger{36} - %msg%n"
