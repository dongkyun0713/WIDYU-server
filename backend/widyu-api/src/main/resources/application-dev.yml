spring:
  config:
    activate:
      on-profile: "dev"

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
    open-in-view: false

logging:
  level:
    org.springframework.web: info
    org.hibernate.SQL: "off"
    org.hibernate.type: "off"
    org.hibernate.orm.jdbc.bind: "off"
observability:
  error-response:
    include-debug-details: true
