spring:
  config:
    activate:
      on-profile: "fcm"

firebase:
  config-path: ${FIREBASE_CONFIG_PATH}
  messaging-url: ${FIREBASE_MESSAGING_URL:https://fcm.googleapis.com/v1/projects/widyu-d384f/messages:send}

---
spring:
  config:
    activate:
      on-profile: "prod"

# User-approved 2026-09-14: initial attempt + 5 retries; normal 24h, emergency 5m.
fcm:
  delivery:
    max-retries: ${FCM_DELIVERY_MAX_RETRIES:5}
    normal-ttl: ${FCM_DELIVERY_NORMAL_TTL:86400s}
    emergency-ttl: ${FCM_DELIVERY_EMERGENCY_TTL:300s}
