# Raw Sensor Batch Configuration (LLD-0041, LLD-0046)
sensor:
  # 원문 바이트 상한. 50Hz 1초 배치가 2KB 안팎이라 32KB면 충격 보강 배치까지 들어간다.
  max-payload-bytes: ${SENSOR_MAX_PAYLOAD_BYTES:32768}
  # 워치에 내려보내는 수집 설정. collection_mode는 회차 유무로 정하므로 여기 없다.
  config:
    gyro-mode: ${SENSOR_GYRO_MODE:continuous}
    acc-fs-hz: ${SENSOR_ACC_FS_HZ:50}
    batch-sec: 1
    impact-threshold-g: 1.8
    backfill-before-sec: 2
    backfill-after-sec: 10
    hr-upload-sec: 1
    location-move-sec: 5
    location-keepalive-sec: 60
    heartbeat-sec: 60
    # 워치가 설정을 다시 읽을 권고 주기. 실제 주기는 앱 정책이다(FE F9).
    refresh-sec: 60

  # 회차 내보내기(LLD-0050). 값 집합이 미정인 상수는 여기서 바꾼다.
  export:
    poll-delay-ms: ${SENSOR_EXPORT_POLL_DELAY_MS:5000}
    presign-minutes: 15
    server-build: ${SENSOR_EXPORT_SERVER_BUILD:unknown}
    # 기대 샘플 간격(ms). expected_sample_count = 배정 구간 / 간격이며 자료가 없다고 줄이지 않는다(ADR-0032 결정 4).
    expected-period-ms:
      imu_watch: 20
      imu_phone: 20
      hr: 1000
      location: 60000
      heartbeat: 60000
    # 이 공백을 넘으면 missing_intervals로 신고한다.
    gap-threshold-ms:
      imu_watch: 5000
      imu_phone: 5000
      hr: 5000
      location: 120000
      heartbeat: 120000
    clock:
      source-domain: DEVICE_MONOTONIC
      target-domain: UTC_EPOCH_MS
      transform: ANCHOR_PAIR
      evidence-method: APP_REPORTED_ANCHOR
    absent-reason-role-missing: NO_DEVICE_ASSIGNED
    absent-reason-no-data: NO_DATA_IN_THIS_RUN
    absent-reason-not-implemented: NOT_IMPLEMENTED_IN_THIS_RUN
