# 일본 현장실증(pilot) 전용 설정. 이 프로파일로만 실증을 기동한다.
# PilotProfileGuard 가 아래 격리 확인 값을 검증하며, 누락 시 기동을 실패시킨다.
pilot:
  # 격리된 자원(DB·Redis·Firebase 등)을 사용한다고 배포자가 명시적으로 선언해야 true.
  isolation-confirmed: ${PILOT_ISOLATION_CONFIRMED:false}
  # 실증 전용 Firebase 프로젝트 ID. 운영 프로젝트와 반드시 달라야 한다.
  firebase-project-id: ${PILOT_FIREBASE_PROJECT_ID:}
