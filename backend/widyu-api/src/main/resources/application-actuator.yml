management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name:widyu-api}
    distribution:
      percentiles:
        heart.websocket.processing: 0.95,0.99
        heart.ai.detection: 0.95,0.99
        heart.ai.request: 0.95,0.99
        heart.persistence: 0.95,0.99
        heart.emergency.notification: 0.95,0.99
        fcm.send: 0.95,0.99
