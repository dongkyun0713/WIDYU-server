plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'widyu.com'
version = '0.0.1-SNAPSHOT'
description = 'widyu-api'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // 도메인 모듈 의존성
    implementation project(':backend:widyu-domain')

    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web-services'
    implementation 'org.springframework.boot:spring-boot-starter-aop'

    // Retry (포인트 잔액 낙관적 락 충돌 재시도)
    implementation 'org.springframework.retry:spring-retry'

    // Security
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    testImplementation 'org.springframework.security:spring-security-test'

    // Database
    runtimeOnly 'com.mysql:mysql-connector-j'
    testRuntimeOnly 'com.h2database:h2'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    // QueryDSL
    implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
    annotationProcessor "com.querydsl:querydsl-apt:5.0.0:jakarta"
    annotationProcessor "jakarta.annotation:jakarta.annotation-api"
    annotationProcessor "jakarta.persistence:jakarta.persistence-api"

    // FCM
    implementation 'com.google.firebase:firebase-admin:9.2.0'

    // Swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

    // Redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // WebSocket
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // Message
    implementation 'net.nurigo:sdk:4.2.7'

    // Kotlin (required for nurigo SMS SDK)
    implementation 'org.jetbrains.kotlin:kotlin-stdlib'

    // OpenFeign
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'

    // AWS S3
    implementation 'software.amazon.awssdk:s3:2.21.29'

    // Video Processing
    implementation 'net.bramp.ffmpeg:ffmpeg:0.7.0'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Actuator
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Prometheus metrics (simpleclient for compatibility)
    implementation 'io.micrometer:micrometer-registry-prometheus-simpleclient'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:2023.0.1"
        mavenBom "com.fasterxml.jackson:jackson-bom:2.17.2"
    }
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'payment-mysql'
    }
    // 내보내기 표본 zip을 남길지(계약검사기 입력). -Dwidyu.export.keep=true 일 때만 만든다.
    systemProperty 'widyu.export.keep', System.getProperty('widyu.export.keep', 'false')
}

tasks.register('paymentMySqlTest', Test) {
    description = 'Runs payment failure measurements against an explicitly selected disposable loopback MySQL.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'payment-mysql'
    }
    outputs.upToDateWhen { false }
    doFirst {
        if (!System.getenv('PAYMENT_MYSQL_URL')) {
            throw new GradleException('PAYMENT_MYSQL_URL is required; MySQL measurements cannot be skipped.')
        }
    }
}

bootJar {
    mainClass = 'com.widyu.WidyuApiApplication'
}
