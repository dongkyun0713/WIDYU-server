name: CI - Build & Test

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - feature/*
      - fix/*
      - refactor/*

jobs:
  harness:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Harness regression tests
        run: |
          python3 -m unittest discover -s scripts/harness -p 'test_*.py'
          python3 scripts/harness/test-pre-bash-guard.py
          python3 scripts/harness/test-pre-edit-branch-guard.py
      - name: Java rules for changed lines
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ -n "$PR_BASE_SHA" ]]; then
            harness_base="$(git merge-base "$PR_BASE_SHA" HEAD)"
          elif [[ -n "$BEFORE_SHA" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            harness_base="$BEFORE_SHA"
          else
            harness_base="$(git merge-base origin/develop HEAD)"
          fi
          bash scripts/harness/verify.sh --static-only --base "$harness_base"

  build-and-test:
    runs-on: ubuntu-latest

    # 실제 Redis 연동 테스트(WsTokenService 동시성 등)용 서비스 컨테이너 — 러너에 localhost:6379 제공
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # 1️⃣ 코드 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ JDK 21 설치
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 3️⃣ Gradlew 실행 권한 부여
      - name: Grant execute permission for Gradlew
        run: chmod +x gradlew

      # 도메인과 API 소비자를 함께 검증한다.
      - name: Build & Run Tests (domain and API)
        run: ./gradlew :backend:widyu-api:clean :backend:widyu-domain:test :backend:widyu-api:test --no-daemon

      # 5️⃣ 테스트 결과 아티팩트 업로드 (항상 실행)
      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            backend/widyu-api/build/reports/tests/test
            backend/widyu-domain/build/reports/tests/test

  build-admin:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ 코드 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Node.js 설치
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      # 3️⃣ 의존성 설치
      - name: Install dependencies
        working-directory: admin
        run: npm ci

      # 4️⃣ 빌드
      - name: Build Admin
        working-directory: admin
        run: npm run build
