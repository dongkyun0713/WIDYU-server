name: Deploy production
on:
  workflow_dispatch:
permissions:
  contents: read
  # 배포 알림의 소요 시간 계산(실행 시작 시각 조회)에만 쓴다.
  actions: read
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DOCKER_IMAGE_NAME: ${{ secrets.PROD_DOCKER_IMAGE_NAME }}
      PROD_HOST: ${{ secrets.PROD_EC2_HOST }}
      PROD_DOMAIN: ${{ vars.PROD_DOMAIN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Install isolated Redis test executable without starting a host service
        run: bash scripts/ci/prepare-redis.sh
      - name: Validate and build release
        id: validate
        run: |
          bash scripts/docker/validate-release.sh
          python3 -m unittest discover -s scripts/docker -p 'test_*.py'
          ./gradlew :backend:widyu-domain:test :backend:widyu-api:test --no-daemon
          npm --prefix admin ci
          VITE_APP_ENV=prod npm --prefix admin run build
          mkdir -p admin/dist/.well-known
          cp -R .well-known/. admin/dist/.well-known/
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}
      - name: Upload and deploy release
        id: deploy
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_EC2_SSH_PRIVATE_KEY }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$PROD_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$PROD_DOMAIN" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$DOCKER_IMAGE_NAME" =~ ^[a-z0-9._/-]+$ ]]
          test -n "$PROD_SSH_KEY"
          test -n "$PROD_KNOWN_HOSTS"
          deploy_tmp=$(mktemp -d)
          trap 'rm -rf "$deploy_tmp"' EXIT
          printf '%s\n' "$PROD_SSH_KEY" > "$deploy_tmp/key"
          printf '%s\n' "$PROD_KNOWN_HOSTS" > "$deploy_tmp/known_hosts"
          chmod 600 "$deploy_tmp/key" "$deploy_tmp/known_hosts"
          ssh_args=(-i "$deploy_tmp/key" -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$deploy_tmp/known_hosts")
          release="/home/ec2-user/widyu/releases/$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh "${ssh_args[@]}" "ec2-user@$PROD_HOST" "mkdir -p '$release'"
          tar -czf "$deploy_tmp/release.tgz" docker-compose.yml docker-compose.prod.yml nginx/prod monitoring scripts/docker/prod-up.sh scripts/docker/validate-prod.py admin/dist
          scp "${ssh_args[@]}" "$deploy_tmp/release.tgz" "ec2-user@$PROD_HOST:$release/release.tgz"
          ssh "${ssh_args[@]}" "ec2-user@$PROD_HOST" \
            "cd '$release' && tar -xzf release.tgz && PROD_ENV_FILE=/home/ec2-user/.env DOCKER_IMAGE_NAME='$DOCKER_IMAGE_NAME' IMAGE_TAG='$GITHUB_SHA' PROD_DOMAIN='$PROD_DOMAIN' bash scripts/docker/prod-up.sh"
          echo "Release directory: $release" >> "$GITHUB_STEP_SUMMARY"

      # 알림 실패가 배포 결과를 바꾸지 않게 한다(LLD-0084).
      - name: Send Discord notification
        if: always()
        continue-on-error: true
        env:
          DISCORD_DEPLOY_WEBHOOK_URL: ${{ secrets.DISCORD_DEPLOY_WEBHOOK_URL }}
          ENV_TAG: PROD
          RESULT: ${{ job.status }}
          FAILED_STEP: ${{ steps.validate.outcome == 'failure' && '테스트·빌드 단계' || steps.image.outcome == 'failure' && '이미지 빌드 단계' || steps.deploy.outcome == 'failure' && '서버 배포 단계' || '배포 준비 단계' }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/notify-discord-deploy.sh
