name: Deploy to AWS EC2 using Docker Compose

on:
  push:
    branches:
      - develop

concurrency:
  group: deploy-dev
  cancel-in-progress: true

env:
  DOCKER_IMAGE_NAME: ${{ secrets.DEV_DOCKER_IMAGE_NAME }}
  EC2_HOST: ${{ secrets.EC2_HOST }}
  EC2_SSH_USER: ec2-user
  PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}

jobs:
  build-and-push-docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Grant execute permission for Gradlew
        run: chmod +x gradlew

      - name: Build widyu-api module only
        run: ./gradlew :backend:widyu-api:clean :backend:widyu-api:bootJar --no-daemon

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and Push Image (latest + sha)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE_NAME }}:latest
            ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.DOCKER_IMAGE_NAME }}:cache
          cache-to: type=registry,ref=${{ env.DOCKER_IMAGE_NAME }}:cache,mode=max

  deploy-to-ec2:
    name: Deploy to AWS EC2
    needs: build-and-push-docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: admin/package-lock.json

      - name: Build admin SPA
        run: |
          cd admin
          npm ci
          npm run build

      - name: Sync compose files to EC2
        run: |
          printf "%s" "${{ env.PRIVATE_KEY }}" > private_key.pem
          chmod 600 private_key.pem

          ssh -i private_key.pem -o StrictHostKeyChecking=no \
            ${{ env.EC2_SSH_USER }}@${{ env.EC2_HOST }} \
            "mkdir -p /home/ec2-user/widyu/nginx /home/ec2-user/widyu/admin/dist"
            # "mkdir -p /home/ec2-user/widyu/nginx /home/ec2-user/widyu/monitoring"

          rsync -avz -e "ssh -i private_key.pem -o StrictHostKeyChecking=no" \
            docker-compose.yml docker-compose.dev.yml \
            ${{ env.EC2_SSH_USER }}@${{ env.EC2_HOST }}:/home/ec2-user/widyu/

          # --inplace: nginx.conf가 단일 파일 바인드 마운트라, 파일 교체 시 inode가 바뀌면
          # 컨테이너가 옛 파일을 계속 참조해 `nginx -s reload`가 반영되지 않는다.
          # in-place로 덮어써 inode를 유지하면 reload가 정상 반영된다.
          rsync -avz --inplace -e "ssh -i private_key.pem -o StrictHostKeyChecking=no" \
            nginx/ \
            ${{ env.EC2_SSH_USER }}@${{ env.EC2_HOST }}:/home/ec2-user/widyu/nginx/

          rsync -avz --delete -e "ssh -i private_key.pem -o StrictHostKeyChecking=no" \
            scripts/ \
            ${{ env.EC2_SSH_USER }}@${{ env.EC2_HOST }}:/home/ec2-user/widyu/scripts/

          rsync -avz --delete -e "ssh -i private_key.pem -o StrictHostKeyChecking=no" \
            admin/dist/ \
            ${{ env.EC2_SSH_USER }}@${{ env.EC2_HOST }}:/home/ec2-user/widyu/admin/dist/

          rsync -avz -e "ssh -i private_key.pem -o StrictHostKeyChecking=no" \
            .well-known/ \
            ${{ env.EC2_SSH_USER }}@${{ env.EC2_HOST }}:/home/ec2-user/widyu/admin/dist/.well-known/

          # rsync -avz --delete -e "ssh -i private_key.pem -o StrictHostKeyChecking=no" \
          #   monitoring/ \
          #   ${{ env.EC2_SSH_USER }}@${{ env.EC2_HOST }}:/home/ec2-user/widyu/monitoring/
  
          rm -f private_key.pem

      - name: Deploy with Docker Compose
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_SSH_USER }}
          key: ${{ env.PRIVATE_KEY }}
          script: |
            set -e

            cd /home/ec2-user/widyu

            # .env 파일 복사 및 Docker 이미지 정보 추가
            cp /home/ec2-user/.env .env
            echo "DOCKER_IMAGE_NAME=${{ env.DOCKER_IMAGE_NAME }}" >> .env
            echo "IMAGE_TAG=${{ github.sha }}" >> .env

            echo "🐳 Pulling Docker image..."
            docker pull ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}

            echo "🚀 Deploying widyu-api (monitoring containers stay running)..."
            docker rm -f widyu-api-dev 2>/dev/null || true
            docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --no-deps --force-recreate widyu-api

            echo "🔄 Reloading nginx config..."
            docker exec widyu-nginx-dev nginx -s reload

            # echo "🔧 Ensuring monitoring stack is running..."
            # docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d prometheus grafana loki promtail node-exporter
