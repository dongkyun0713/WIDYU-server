server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Spring Boot 애플리케이션 로그
  - job_name: widyu-api
    static_configs:
      - targets:
          - localhost
        labels:
          job: widyu-api
          app: widyu-api
          __path__: /var/log/widyu/*.log

  - job_name: widyu-api-dev
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: /widyu-api-dev
        action: keep
      - target_label: service
        replacement: widyu-api-dev
      - target_label: environment
        replacement: dev
    pipeline_stages:
      - docker: {}
      - regex:
          expression: '.* (?P<level>TRACE|DEBUG|INFO|WARN|ERROR) .*'
      - labels:
          level:
