apiVersion: 1

contactPoints:
  - orgId: 1
    name: widyu-development-discord
    receivers:
      - uid: widyu-development-discord
        type: discord
        settings:
          url: $DISCORD_WEBHOOK_URL
          title: "{{ .CommonLabels.alertname }}"
          message: |
            {{ .CommonAnnotations.summary }}
            {{ range .Alerts.Firing }}
            error: {{ .Annotations.error_summary }}
            request: {{ .Annotations.request_uri }}
            traceId: {{ .Labels.traceId }}
            Grafana: {{ .Annotations.grafana_url }}
            {{ end }}
