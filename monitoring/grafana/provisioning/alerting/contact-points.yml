apiVersion: 1

# 알림 모양과 AI 분석은 alert-relay가 만든다(LLD-0084). 로그 규칙은 1분 창이라 곧바로 해소되므로 해소 알림은 보내지 않는다.
contactPoints:
  - orgId: 1
    name: widyu-development-discord
    receivers:
      - uid: widyu-development-discord
        type: webhook
        disableResolveMessage: true
        settings:
          url: http://alert-relay:8080/grafana
          httpMethod: POST
