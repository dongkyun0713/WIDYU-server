apiVersion: 1

# 개발 서버 에러 알림 (LLD-0084). 규칙 레이블 kind로 alert-relay가 Discord 메시지 모양을 고른다.
# LogQL regexp는 패턴이 맞지 않는 줄을 거르지 않으므로, 줄 필터로 형식을 맞추고 `| <label> != ""`로 빈 레이블 줄을 버린다.
# 레이블 조합이 곧 알림 인스턴스다. traceId·회원 ID·메시지처럼 요청마다 다른 값은 레이블로 두지 않고 relay가 Loki에서 대표 로그로 채운다.
groups:
  - orgId: 1
    name: widyu-development-errors
    folder: WIDYU Development
    interval: 1m
    rules:
      - uid: widyu-development-api-exception
        title: DEV API 실패
        condition: C
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: "API 요청이 서버 오류로 실패했습니다."
          grafana_url: "{{ externalURL }}d/widyu-development-errors"
        labels:
          environment: dev
          service: widyu-api-dev
          kind: api
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: loki
            model:
              expr: 'sum by (api, method, path, exceptionType) (count_over_time({service="widyu-api-dev", environment="dev"} |= " ERROR traceId=" |= "[EXCEPTION]" | regexp "\\[EXCEPTION\\] Time=[^ ]+ Api=(?P<api>.+?) Method=(?P<method>[A-Z]+) Path=(?P<path>[^ ]+) Actor=[^ ]+ Target=[^ ]+ ExceptionType=(?:[^ ]*\\.)?(?P<exceptionType>[^ .]+) " | api != "" [1m]))'
              refId: A
          - refId: B
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    params: []
                    type: last
                  type: query
      - uid: widyu-development-scheduler-failure
        title: DEV 스케줄러 실패
        condition: C
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: "스케줄러 작업이 실패했습니다."
          grafana_url: "{{ externalURL }}d/widyu-development-errors"
        labels:
          environment: dev
          service: widyu-api-dev
          kind: scheduler
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: loki
            model:
              expr: 'sum by (task, logger, exceptionType) (count_over_time({service="widyu-api-dev", environment="dev"} |~ " ERROR traceId=none \\[scheduling-" | regexp "\\[scheduling-[0-9]+\\] (?P<logger>[^ ]+) - (?:\\[SCHEDULER\\] Task=(?P<task>[^ ]+) ExceptionType=(?P<exceptionType>[^ ]+) )?" | logger != "" [1m]))'
              refId: A
          - refId: B
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    params: []
                    type: last
                  type: query
      - uid: widyu-development-push-failure
        title: DEV 푸시 발송 실패
        condition: C
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: "푸시 알림을 끝내 보내지 못했습니다."
          grafana_url: "{{ externalURL }}d/widyu-development-errors"
        labels:
          environment: dev
          service: widyu-api-dev
          kind: push
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: loki
            model:
              expr: 'sum by (type, emergency, reason) (count_over_time({service="widyu-api-dev", environment="dev"} |= " ERROR traceId=" |= "[FCM_FAILED]" | regexp "\\[FCM_FAILED\\] Type=(?P<type>[^ ]+) Emergency=(?P<emergency>[^ ]+) .* Reason=(?P<reason>[^ ]+)" | type != "" [1m]))'
              refId: A
          - refId: B
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    params: []
                    type: last
                  type: query
      - uid: widyu-development-api-error
        title: DEV 기타 ERROR
        condition: C
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: "분류되지 않은 ERROR 로그가 발생했습니다."
          grafana_url: "{{ externalURL }}d/widyu-development-errors"
        labels:
          environment: dev
          service: widyu-api-dev
          kind: error
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: loki
            model:
              expr: 'sum by (logger) (count_over_time({service="widyu-api-dev", environment="dev"} |= " ERROR traceId=" !~ "\\[EXCEPTION\\]|\\[FCM_FAILED\\]|\\[scheduling-" | regexp "ERROR traceId=[^ ]+ \\[[^\\]]*\\] (?P<logger>[^ ]+) - " | logger != "" [1m]))'
              refId: A
          - refId: B
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              expression: B
              refId: C
              type: threshold
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    params: []
                    type: last
                  type: query
