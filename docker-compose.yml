# Base configuration (공통 설정)
# - 로컬: docker compose up (자동으로 override 병합)
# - 개발: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# - 운영: docker compose -f docker-compose.yml -f docker-compose.prod.yml up

services:
  # Spring Boot Application (공통)
  widyu-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DOCKER_IMAGE_NAME}:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      # Spring Profile (오버라이드에서 지정)
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}

      # Database (공통)
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      DB_NAME: ${DB_NAME}
      MYSQL_USERNAME: ${MYSQL_USERNAME}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

      # Redis (공통)
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      # JWT (공통)
      JWT_ACCESS_TOKEN_SECRET: ${JWT_ACCESS_TOKEN_SECRET}
      JWT_ACCESS_TOKEN_EXPIRATION_TIME: ${JWT_ACCESS_TOKEN_EXPIRATION_TIME}
      JWT_REFRESH_TOKEN_SECRET: ${JWT_REFRESH_TOKEN_SECRET}
      JWT_REFRESH_TOKEN_EXPIRATION_TIME: ${JWT_REFRESH_TOKEN_EXPIRATION_TIME}
      JWT_TEMPORARY_TOKEN_SECRET: ${JWT_TEMPORARY_TOKEN_SECRET}
      JWT_TEMPORARY_TOKEN_EXPIRATION_TIME: ${JWT_TEMPORARY_TOKEN_EXPIRATION_TIME}

      # OAuth (공통)
      OAUTH_NAVER_CLIENT_ID: ${OAUTH_NAVER_CLIENT_ID}
      OAUTH_NAVER_CLIENT_SECRET: ${OAUTH_NAVER_CLIENT_SECRET}
      OAUTH_NAVER_REDIRECT_URI: ${OAUTH_NAVER_REDIRECT_URI}
      OAUTH_KAKAO_CLIENT_ID: ${OAUTH_KAKAO_CLIENT_ID}
      OAUTH_KAKAO_REDIRECT_URI: ${OAUTH_KAKAO_REDIRECT_URI}
      OAUTH_KAKAO_ADMIN_KEY: ${OAUTH_KAKAO_ADMIN_KEY}
      OAUTH_APPLE_IOS_CLIENT_ID: ${OAUTH_APPLE_IOS_CLIENT_ID}
      OAUTH_APPLE_ANDROID_CLIENT_ID: ${OAUTH_APPLE_ANDROID_CLIENT_ID}
      OAUTH_APPLE_TEAM_ID: ${OAUTH_APPLE_TEAM_ID}
      OAUTH_APPLE_KEY_ID: ${OAUTH_APPLE_KEY_ID}
      OAUTH_APPLE_PRIVATE_KEY: ${OAUTH_APPLE_PRIVATE_KEY}
      OAUTH_APPLE_REDIRECT_URI: ${OAUTH_APPLE_REDIRECT_URI}

      # AWS S3 (공통)
      AWS_ACCESS_KEY: ${AWS_ACCESS_KEY}
      AWS_SECRET_KEY: ${AWS_SECRET_KEY}
      AWS_REGION: ${AWS_REGION}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_BASE_URL: ${S3_BASE_URL}

      # FCM (공통)
      FIREBASE_CONFIG_PATH: ${FIREBASE_CONFIG_PATH}

      # SMS (공통)
      COOLSMS_API_KEY: ${COOLSMS_API_KEY}
      COOLSMS_API_SECRET: ${COOLSMS_API_SECRET}
      COOLSMS_PHONE: ${COOLSMS_PHONE}
      COOLSMS_VERIFICATION_CODE_LENGTH: ${COOLSMS_VERIFICATION_CODE_LENGTH}
      COOLSMS_VERIFICATION_CODE_TTL: ${COOLSMS_VERIFICATION_CODE_TTL}

      # Payment (공통)
      PAYMENT_SECRET_KEY: ${PAYMENT_SECRET_KEY}

      # Medicine API (공통)
      MEDICINE_API_SERVICE_KEY: ${MEDICINE_API_KEY}

      # Juso API (공통)
      JUSO_CONFM_KEY: ${JUSO_CONFM_KEY}

      # Kakao Geocoding (로그인용 키와 분리)
      KAKAO_GEOCODING_API_KEY: ${KAKAO_GEOCODING_API_KEY}

      # Admin (공통)
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

      # Swagger (공통)
      SWAGGER_VERSION: ${SWAGGER_VERSION}
      SWAGGER_URL: ${SWAGGER_URL}

      # FFmpeg (공통)
      FFMPEG_PATH: ${FFMPEG_PATH}
      FFPROBE_PATH: ${FFPROBE_PATH}

      # AI Server (공통)
      AI_SERVER_URL: ${AI_SERVER_URL:-http://widyu-ai:5000}

    volumes:
      - app_logs:/app/logs
    networks:
      - widyu-network
    # healthcheck:
    #   test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 10
    #   start_period: 120s

  # Redis Cache (공통)
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    networks:
      - widyu-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # AI Server (심박수 이상치 판별)
  widyu-ai:
    image: ryuchanghoon/widyu-ai-ver7:latest
    container_name: widyu-ai
    restart: unless-stopped
    ports:
      - "5000:5000"
    networks:
      - widyu-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Nginx Reverse Proxy (공통)
  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT}:80"
      - "${NGINX_HTTPS_PORT}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./admin/dist:/usr/share/nginx/admin:ro
      - nginx_logs:/var/log/nginx
      - certbot_webroot:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    networks:
      - widyu-network
    depends_on:
      - widyu-api
    # healthcheck:
    #   test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/actuator/health"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3

  # Certbot (필요할 때만 docker compose run으로 실행)
  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot_webroot:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    networks:
      - widyu-network
    profiles:
      - manual  # 자동 시작 방지

  # Node Exporter (호스트 시스템 메트릭)
  node-exporter:
    image: prom/node-exporter:latest
    container_name: widyu-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - widyu-network

  # Prometheus (메트릭 수집)
  prometheus:
    image: prom/prometheus:latest
    container_name: widyu-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - widyu-network

  # Grafana (시각화 대시보드)
  grafana:
    image: grafana/grafana:latest
    container_name: widyu-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - widyu-network
    depends_on:
      - prometheus
      - loki

  # Loki (로그 저장소)
  loki:
    image: grafana/loki:latest
    container_name: widyu-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - widyu-network

  # Promtail (로그 수집기)
  promtail:
    image: grafana/promtail:latest
    container_name: widyu-promtail
    restart: unless-stopped
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - app_logs:/var/log/widyu:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    networks:
      - widyu-network
    depends_on:
      - loki

networks:
  widyu-network:
    driver: bridge

volumes:
  redis_data:
  app_logs:
  nginx_logs:
  certbot_webroot:
  certbot_certs:
  prometheus_data:
  grafana_data:
  loki_data:
